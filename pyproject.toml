[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sampic-deadtime-tests"
version = "0.0.0"
description = "Deadtime analysis helpers for Sampic digitizer sweeps"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
